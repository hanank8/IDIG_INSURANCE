kind: MCPTools
apiVersion: api.ibm.com/v1
metadata:
  name: classic-models-api-tool-cj121
  namespace: cars
  version: "1.0"
  tags: []
  description: >-
    API for the Classic Models tutorial database with multiple authentication
    options.


    ## Authentication Methods


    This API supports three authentication methods:


    ### 1. OAuth 2.0 (Authorization Code + PKCE)


    Standards-compliant OAuth 2.0 IDP flow  recommended for third-party
    application integrations such as watsonx Orchestrate (RFC 6749, RFC 7636,
    RFC 7009).


    Clients must be registered server-side before use. See the [OAuth 2.0
    Authentication guide](docs/OAUTH_AUTHENTICATION.md) for client registration,
    token lifecycle details, and watsonx Orchestrate configuration.


    **Flow summary:**


    1. **Authorize**: GET `/classic-models/api/oauth/authorize/`  user logs in
    via browser

    2. **Exchange code**: POST `/classic-models/api/oauth/token/` 
    `grant_type=authorization_code` + PKCE verifier

    3. **Use token**: `Authorization: Bearer <access_token>`

    4. **Refresh**: POST `/classic-models/api/oauth/token/` 
    `grant_type=refresh_token`

    5. **Revoke**: POST `/classic-models/api/oauth/token/revoke/`


    OIDC auto-discovery: `GET
    /classic-models/api/auth/.well-known/openid-configuration`


    ### 2. JWT Authentication


    Direct user authentication  suitable for first-party clients and testing:


    1. **Login**: POST `/classic-models/api/auth/login/` with username and
    password

    2. **Use Token**: `Authorization: Bearer <access_token>`

    3. **Refresh**: POST `/classic-models/api/oauth/token/` 
    `grant_type=refresh_token`

    4. **Logout**: POST `/classic-models/api/auth/logout/`


    ### 3. API Key Authentication


    System-level authentication with full admin access (demo purposes):


    - **Header**: `X-API-Key: your-api-key`

    - **Access**: Full read/write/delete permissions

    - **Configuration**: Set `API_KEY` environment variable

    - **Use Case**: Automated scripts, testing, system integrations


    ## Base Path


    All endpoints are served at `/classic-models` base path.


    ## Public Endpoints


    - API documentation (this page)

    - Authentication endpoints (`/classic-models/api/auth/`)

    - OAuth 2.0 endpoints (`/classic-models/api/oauth/`)


    ## Protected Endpoints


    - All Classic Models data endpoints (`/classic-models/api/v1/`)

    - Require either a JWT/OAuth Bearer token OR API key
