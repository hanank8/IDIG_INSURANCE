        Validates the OAuth parameters and renders the login form for the
        resource owner (user) to authenticate. Errors that cannot safely
        redirect (unknown `client_id`, unregistered `redirect_uri`) return HTTP
        400 directly per RFC 6749 �4.1.2.1.
      inputSchema:
        type: object
        properties:
          client_id:
            description: The registered OAuth client identifier (UUID).
            x-parameter-location: query
            type: string
          code_challenge:
            description: BASE64URL(SHA-256(code_verifier))  PKCE challenge (RFC 7636).
            x-parameter-location: query
            type: string
          code_challenge_method:
            description: Must be `"S256"`. Plain is not supported.
            x-parameter-location: query
            type: string
          redirect_uri:
            description: Must exactly match one of the URIs registered for this client.
            x-parameter-location: query
            type: string
          response_type:
            description: Must be `"code"`.
            x-parameter-location: query
            type: string
          scope:
            description: Space-separated list of requested scopes (optional; currently
              unused).
            x-parameter-location: query
            type: string
          state:
            description: Opaque value the client uses to maintain state between request and
