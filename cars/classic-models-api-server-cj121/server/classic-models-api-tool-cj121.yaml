    - name: oauth_authorize_post
      description: >-
        Processes the submitted login form credentials. On success issues a
        short-lived authorization code and redirects to
        `redirect_uri?code=<code>&state=<state>`. On invalid credentials
        re-renders the form with an error message.


        Errors that cannot safely redirect (unknown `client_id`, unregistered
        `redirect_uri`) return HTTP 400 directly per RFC 6749 �4.1.2.1.
      inputSchema:
        type: object
        properties:
          response_type:
            type: string
            minLength: 1
            description: Must be `"code"`.
          client_id:
            type: string
            format: uuid
            description: Registered OAuth client identifier.
          redirect_uri:
            type: string
            minLength: 1
            description: Must exactly match a registered redirect URI.
          code_challenge:
            type: string
            minLength: 1
            description: BASE64URL(SHA-256(code_verifier))  PKCE challenge.
          code_challenge_method:
            type: string
            minLength: 1
            description: Must be `"S256"`.
          state:
            type: string
            minLength: 1
            description: Opaque state value echoed back in the redirect.
          scope:
            type: string
            minLength: 1
            description: Space-separated scopes (optional; currently unused).
          username:
            type: string
            minLength: 1
            description: Resource owner username.
          password:
            type: string
            minLength: 1
            description: Resource owner password.
        required:
          - response_type
          - client_id
          - redirect_uri
          - code_challenge
          - code_challenge_method
          - username
          - password
      title: OAuth 2.0 Authorization  Submit Credentials
      x-api-binding:
        operationPath: /classic-models/api/oauth/authorize/
        operationMethod: POST
        api:
          $path: ./classic-models-api-spec.yml
