kind: Telemetry
apiVersion: api.ibm.com/v1
metadata:
  name: Telemetry-hl95u
  namespace: llmgateway
  version: 1.0.0
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  verbosity:
    - level: basic
      onSuccessTrimTo: detailed
      inboundLevel: detailed
      outboundLevel: detailed
      operations:
        - method: GET
        - method: POST
        - method: PUT
        - method: DELETE
        - method: PATCH
        - method: HEAD
        - method: OPTIONS
